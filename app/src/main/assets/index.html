<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>DotGlobe VPN — ALPHA GO</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root{
    --bg:#000000;
    --accent:#A855F7;
    --glow:#C77DFF;
    --gold:#FACC15;
    --text:#FFFFFF;
    --glass:rgba(255,255,255,0.04);
    --glass-2:rgba(255,255,255,0.07);
    --border:rgba(168,85,247,0.18);
    --muted:rgba(255,255,255,0.5);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;font-family:-apple-system,'SF Pro Display','Cairo',sans-serif;color:var(--text);}
  body{
    background:#000000;
    position:fixed;inset:0;
  }
  .app{position:relative;width:100%;height:100%;max-width:440px;margin:0 auto;overflow:hidden;}

  /* subtle radial glow behind globe */
  .bg-glow{
    position:absolute;top:14%;left:50%;transform:translateX(-50%);
    width:340px;height:340px;border-radius:50%;
    background:radial-gradient(circle, rgba(168,85,247,0.18) 0%, rgba(168,85,247,0.06) 40%, rgba(0,0,0,0) 70%);
    pointer-events:none;z-index:0;transition:opacity .6s, filter .6s;
  }
  body.connected .bg-glow{filter:brightness(1.6);}

  /* ===== SCREENS ===== */
  .screen{position:absolute;inset:0;display:none;flex-direction:column;z-index:1;}
  .screen.active{display:flex;animation:fadeIn .4s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

  /* ===== HOME SCREEN ===== */
  .home-top{flex:0 0 auto;padding:env(safe-area-inset-top,12px) 16px 0;}
  .globe-wrap{flex:0 0 auto;display:flex;align-items:center;justify-content:center;position:relative;height:260px;margin-top:6px;}
  #globeCanvas{display:block;cursor:grab;touch-action:none;}
  #globeCanvas:active{cursor:grabbing;}
  #globeAtm{
    position:absolute;width:280px;height:280px;border-radius:50%;
    background:radial-gradient(circle, rgba(199,125,255,0.22) 0%, rgba(168,85,247,0.10) 45%, rgba(0,0,0,0) 70%);
    pointer-events:none;transition:opacity .6s;opacity:0.85;
  }

  .home-center{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:0 20px;}

  /* status text */
  .status-text{font-size:15px;font-weight:600;letter-spacing:0.5px;color:var(--glow);margin-bottom:6px;transition:color .3s;}
  body.connected .status-text{color:var(--glow);text-shadow:0 0 12px rgba(199,125,255,0.6);}

  /* LED timer */
  .timer{
    font-family:'SFMono-Regular',Menlo,Consolas,'Courier New',monospace;
    font-size:36px;font-weight:700;letter-spacing:2px;color:#fff;
    text-shadow:0 0 8px rgba(199,125,255,0.9),0 0 18px rgba(168,85,247,0.7),0 0 28px rgba(168,85,247,0.4);
    line-height:1.1;margin-bottom:18px;direction:ltr;
  }

  /* server pill - glassmorphism */
  .server-pill{
    display:flex;align-items:center;gap:9px;
    background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid var(--border);border-radius:100px;padding:7px 16px 7px 8px;
    box-shadow:0 4px 24px rgba(0,0,0,0.4);margin-bottom:24px;
  }
  .server-pill .flag-dot{width:26px;height:26px;border-radius:50%;flex:0 0 auto;background:#222;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.15);}
  .server-pill .srv-name{font-size:14px;font-weight:600;}
  .server-pill .srv-ping{font-size:11px;color:var(--glow);display:flex;align-items:center;gap:3px;}
  .server-pill .srv-ping::before{content:'';width:6px;height:6px;border-radius:50%;background:#34C759;box-shadow:0 0 6px #34C759;}

  /* power button */
  .power-wrap{position:relative;width:120px;height:120px;display:flex;align-items:center;justify-content:center;margin-bottom:8px;}
  #powerBtn{
    width:90px;height:90px;border-radius:50%;border:none;cursor:pointer;
    background:radial-gradient(circle at 50% 40%, rgba(40,20,60,0.9), rgba(10,5,20,0.95));
    display:flex;align-items:center;justify-content:center;position:relative;z-index:2;
    box-shadow:0 0 0 2px rgba(168,85,247,0.5), 0 0 24px rgba(168,85,247,0.35), inset 0 0 20px rgba(168,85,247,0.15);
    transition:box-shadow .4s, transform .2s;
  }
  #powerBtn:active{transform:scale(0.96);}
  #powerBtn svg{width:38px;height:38px;stroke:var(--glow);stroke-width:2;fill:none;stroke-linecap:round;filter:drop-shadow(0 0 6px rgba(199,125,255,0.8));}
  /* neon ring */
  .power-ring{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(168,85,247,0.6);box-shadow:0 0 18px rgba(168,85,247,0.4);pointer-events:none;transition:all .4s;}
  /* connecting pulse */
  #powerBtn.connecting{box-shadow:0 0 0 2px rgba(168,85,247,0.8), 0 0 40px rgba(168,85,247,0.6), inset 0 0 20px rgba(168,85,247,0.2);}
  .power-ring.connecting{animation:pulseRing 1.2s ease-out infinite;}
  @keyframes pulseRing{0%{transform:scale(1);opacity:0.8;}100%{transform:scale(1.45);opacity:0;}}
  /* connected orbit */
  body.connected #powerBtn{box-shadow:0 0 0 2px rgba(168,85,247,0.9), 0 0 50px rgba(168,85,247,0.7), inset 0 0 25px rgba(168,85,247,0.25);}
  body.connected #powerBtn svg{stroke:#fff;}
  body.connected .power-ring{border-color:rgba(199,125,255,0.9);box-shadow:0 0 28px rgba(199,125,255,0.6);animation:orbitRing 3s linear infinite;}
  @keyframes orbitRing{0%{transform:rotate(0deg) scale(1.08);border-top-color:transparent;}100%{transform:rotate(360deg) scale(1.08);border-top-color:transparent;}}

  /* country pills - horizontal scroll */
  .country-pills{display:flex;gap:8px;overflow-x:auto;padding:18px 16px 8px;scrollbar-width:none;-ms-overflow-style:none;flex:0 0 auto;}
  .country-pills::-webkit-scrollbar{display:none;}
  .cpill{
    flex:0 0 auto;display:flex;align-items:center;gap:7px;
    background:var(--glass);border:1px solid var(--border);border-radius:100px;
    padding:8px 14px 8px 8px;font-size:13px;color:#fff;cursor:pointer;white-space:nowrap;
    transition:all .25s;
  }
  .cpill .cflag{width:22px;height:22px;border-radius:50%;flex:0 0 auto;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.1);}
  .cpill.active{background:var(--gold);color:#000;border-color:var(--gold);box-shadow:0 0 18px rgba(250,204,21,0.4);}
  .cpill.active .cping{color:#5a4a00;}

  /* ===== CONFIG SCREEN ===== */
  .config-screen{padding:env(safe-area-inset-top,12px) 16px 90px;overflow-y:auto;}
  .cfg-header{padding:14px 0 16px;text-align:center;}
  .cfg-header h1{font-size:22px;font-weight:700;margin-bottom:4px;}
  .cfg-header p{font-size:13px;color:var(--muted);}
  .import-btn{
    width:100%;display:flex;align-items:center;justify-content:center;gap:10px;
    padding:22px;border:2px dashed rgba(168,85,247,0.45);border-radius:18px;
    background:var(--glass);color:var(--glow);font-size:15px;font-weight:600;cursor:pointer;margin-bottom:20px;transition:all .25s;
  }
  .import-btn:active{background:var(--glass-2);border-color:var(--accent);}
  .import-btn svg{width:26px;height:26px;stroke:currentColor;stroke-width:1.8;fill:none;}
  .cfg-list-label{font-size:13px;color:var(--muted);margin:0 4px 10px;display:flex;justify-content:space-between;align-items:center;}
  .cfg-list-label .count{background:var(--glass);border:1px solid var(--border);border-radius:100px;padding:2px 10px;font-size:11px;color:var(--glow);}
  #cfgListContainer{display:flex;flex-direction:column;gap:10px;}
  .cfg-empty{text-align:center;padding:40px 16px;color:var(--muted);font-size:14px;line-height:1.7;}
  .cfg-item-box{display:flex;align-items:center;gap:12px;background:var(--glass);border:1px solid var(--border);border-radius:14px;padding:12px;transition:all .25s;}
  .cfg-item-box.active{border-color:var(--accent);box-shadow:0 0 16px rgba(168,85,247,0.25);}
  .cfg-item-icon{width:38px;height:38px;flex:0 0 auto;border-radius:10px;background:rgba(168,85,247,0.15);display:flex;align-items:center;justify-content:center;}
  .cfg-item-icon svg{width:20px;height:20px;stroke:var(--glow);stroke-width:1.8;fill:none;}
  .cfg-item-info{flex:1 1 auto;min-width:0;}
  .cfg-item-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cfg-item-meta{display:flex;gap:8px;margin-top:3px;}
  .cfg-item-meta .tag{font-size:10px;background:var(--glass-2);padding:1px 7px;border-radius:6px;color:var(--muted);}
  .cfg-item-meta .enc{font-size:10px;color:#34C759;display:flex;align-items:center;gap:2px;}
  .cfg-item-actions{display:flex;gap:6px;flex:0 0 auto;}
  .cfg-act-btn{width:32px;height:32px;border-radius:9px;border:1px solid var(--border);background:var(--glass-2);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .cfg-act-btn svg{width:15px;height:15px;stroke:#fff;stroke-width:2;fill:none;}
  .cfg-act-btn.del svg{stroke:#FF3B30;}

  /* ===== LOGS SCREEN ===== */
  .logs-screen{padding:env(safe-area-inset-top,12px) 16px 90px;overflow-y:auto;}
  .logs-screen h1{font-size:22px;font-weight:700;padding:14px 0 12px;}
  .logs-toolbar{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none;}
  .logs-toolbar::-webkit-scrollbar{display:none;}
  .logs-toolbar .chip{flex:0 0 auto;background:var(--glass);border:1px solid var(--border);border-radius:100px;padding:6px 14px;font-size:12px;color:var(--muted);cursor:pointer;}
  .logs-toolbar .chip.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  #logsList{display:flex;flex-direction:column;gap:8px;}
  .log-item{display:flex;align-items:center;gap:10px;background:var(--glass);border:1px solid var(--border);border-radius:12px;padding:10px 12px;}
  .log-item .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;}
  .log-item .body{flex:1 1 auto;}
  .log-item .msg{font-size:13px;}
  .log-item .ts{font-size:10px;color:var(--muted);margin-top:2px;}

  /* ===== SETTINGS SCREEN ===== */
  .settings-screen{padding:env(safe-area-inset-top,12px) 16px 90px;overflow-y:auto;}
  .settings-screen h1{font-size:22px;font-weight:700;padding:14px 0 12px;}
  .set-group{margin-bottom:18px;}
  .set-group .gtitle{font-size:12px;color:var(--muted);margin:0 4px 8px;}
  .set-group .glass{background:var(--glass);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
  .set-item{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid rgba(168,85,247,0.08);}
  .set-item:last-child{border-bottom:none;}
  .set-item .ic{width:30px;height:30px;flex:0 0 auto;border-radius:8px;background:var(--glass-2);display:flex;align-items:center;justify-content:center;}
  .set-item .ic svg{width:17px;height:17px;stroke:var(--glow);stroke-width:1.8;fill:none;}
  .set-item .lbl{flex:1 1 auto;}
  .set-item .lbl .t{font-size:14px;font-weight:500;}
  .set-item .lbl .s{font-size:11px;color:var(--muted);margin-top:1px;}
  .toggle{width:42px;height:25px;border-radius:100px;background:rgba(255,255,255,0.1);position:relative;flex:0 0 auto;transition:background .25s;cursor:pointer;}
  .toggle .knob{position:absolute;top:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:left .25s;right:3px;}
  .toggle.on{background:var(--accent);}
  .toggle.on .knob{left:3px;right:auto;}
  .set-foot{text-align:center;padding:18px 0;font-size:12px;color:var(--muted);line-height:1.7;}

  /* ===== BOTTOM NAV ===== */
  .nav{
    position:absolute;bottom:0;left:0;right:0;height:72px;padding-bottom:env(safe-area-inset-bottom,0);
    display:flex;align-items:center;justify-content:space-around;
    background:rgba(0,0,0,0.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border-top:1px solid var(--border);z-index:10;
  }
  .nav-btn{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);cursor:pointer;padding:6px 10px;flex:1;}
  .nav-btn svg{width:22px;height:22px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  .nav-btn .lbl{font-size:10px;}
  .nav-btn.active{color:var(--glow);}
  .nav-btn.active svg{filter:drop-shadow(0 0 6px rgba(199,125,255,0.6));}
</style>
</head>
<body>
<div class="app">
  <div class="bg-glow"></div>

  <!-- ========== HOME ========== -->
  <div class="screen active" id="sc-home">
    <div class="home-top"></div>
    <div class="globe-wrap">
      <div id="globeAtm"></div>
      <canvas id="globeCanvas"></canvas>
    </div>
    <div class="home-center">
      <div class="status-text" id="statusText">غير متصل</div>
      <div class="timer" id="timer">00:00:00</div>
      <div class="server-pill">
        <div class="flag-dot" id="flagDot" style="background:linear-gradient(135deg,#006233,#D21034)"></div>
        <div>
          <div class="srv-name" id="serverName">الجزائر</div>
          <div class="srv-ping" id="serverPing">24ms</div>
        </div>
      </div>
      <div class="power-wrap">
        <div class="power-ring" id="powerRing"></div>
        <button id="powerBtn" onclick="toggleVPN()">
          <svg viewBox="0 0 24 24"><path d="M12 3v9"/><path d="M6.4 6.4a8 8 0 1 0 11.2 0"/></svg>
        </button>
      </div>
    </div>
    <div class="country-pills" id="countryPills"></div>
  </div>

  <!-- ========== CONFIG ========== -->
  <div class="screen config-screen" id="sc-config">
    <div class="cfg-header">
      <h1>الكونفيغات</h1>
      <p>استورد ملف .dgvpn لتفعيل الاتصال</p>
    </div>
    <label class="import-btn" for="cfgFileInput">
      <svg viewBox="0 0 24 24"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></svg>
      استيراد ملف .dgvpn
    </label>
    <input type="file" id="cfgFileInput" accept=".dgvpn" style="display:none" onchange="handleConfigUpload(event)">
    <div class="cfg-list-label">
      <span>القائمة</span>
      <span class="count" id="cfgCount">0</span>
    </div>
    <div id="cfgListContainer"></div>
  </div>

  <!-- ========== LOGS ========== -->
  <div class="screen logs-screen" id="sc-logs">
    <h1>السجلات</h1>
    <div class="logs-toolbar">
      <div class="chip active" onclick="filterLogs('all',this)">الكل</div>
      <div class="chip" onclick="filterLogs('info',this)">معلومات</div>
      <div class="chip" onclick="filterLogs('warn',this)">تحذيرات</div>
      <div class="chip" onclick="filterLogs('config',this)">تكوين</div>
    </div>
    <div id="logsList"></div>
  </div>

  <!-- ========== SETTINGS ========== -->
  <div class="screen settings-screen" id="sc-settings">
    <h1>الإعدادات</h1>
    <div class="set-group">
      <div class="gtitle">عام</div>
      <div class="glass">
        <div class="set-item" onclick="toggleSet(this)"><div class="ic"><svg viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 4 10v4M12 3a6 6 0 0 1-4 10v4M9 21h6"/></svg></div><div class="lbl"><div class="t">الاتصال التلقائي</div><div class="s">عند بدء التشغيل</div></div><div class="toggle on"><div class="knob"></div></div></div>
        <div class="set-item" onclick="toggleSet(this)"><div class="ic"><svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10 21h4"/></svg></div><div class="lbl"><div class="t">الإشعارات</div><div class="s">تنبيهات الاتصال</div></div><div class="toggle on"><div class="knob"></div></div></div>
      </div>
    </div>
    <div class="set-group">
      <div class="gtitle">حول</div>
      <div class="glass">
        <div class="set-item"><div class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg></div><div class="lbl"><div class="t">الإصدار</div><div class="s">DotGlobe VPN v9.0</div></div></div>
        <div class="set-item"><div class="ic"><svg viewBox="0 0 24 24"><path d="M12 2l3 7h7l-5.5 4.5L18 21l-6-4-6 4 1.5-7.5L2 9h7z"/></svg></div><div class="lbl"><div class="t">المطور</div><div class="s">islem</div></div></div>
      </div>
    </div>
    <div class="set-foot">DotGlobe VPN v9.0 · <b>islem</b><br><b>@islem_store10</b> · ALPHA > GO</div>
  </div>

  <!-- ========== NAV ========== -->
  <div class="nav" id="nav">
    <button class="nav-btn active" data-sc="home" onclick="goScreen('home')"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span class="lbl">الرئيسية</span></button>
    <button class="nav-btn" data-sc="config" onclick="goScreen('config')"><svg viewBox="0 0 24 24"><path d="M7 3h7l5 5v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg><span class="lbl">الكونفيغات</span></button>
    <button class="nav-btn" data-sc="logs" onclick="goScreen('logs')"><svg viewBox="0 0 24 24"><path d="M8 3h11a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H8M8 3H5a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h3M8 3v18"/><path d="M11 8h6M11 12h6M11 16h4"/></svg><span class="lbl">السجلات</span></button>
    <button class="nav-btn" data-sc="settings" onclick="goScreen('settings')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg><span class="lbl">الإعدادات</span></button>
    <button class="nav-btn" data-sc="about" onclick="goScreen('home')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg><span class="lbl">حول</span></button>
  </div>
</div>

<script>
// ============ STATE ============
var state = {connected:false, connecting:false, elapsed:0, current:'الجزائر', ping:'24ms', code:'DZ', flag:'linear-gradient(135deg,#006233,#D21034)'};
var logFilter='all';
var logs=[];

// Country pills data
var countries = [
  {nm:'الجزائر', code:'DZ', ms:24, flag:'linear-gradient(135deg,#006233,#D21034)'},
  {nm:'اليابان', code:'JP', ms:38, flag:'linear-gradient(135deg,#EE1C25,#FFB300)'},
  {nm:'سنغافورة', code:'SG', ms:52, flag:'linear-gradient(135deg,#ED2939,#FFFFFF)'},
  {nm:'الإمارات', code:'AE', ms:24, flag:'linear-gradient(135deg,#00732F,#FF0000)'},
  {nm:'ألمانيا', code:'DE', ms:67, flag:'linear-gradient(135deg,#000,#DD0000)'},
  {nm:'هولندا', code:'NL', ms:71, flag:'linear-gradient(135deg,#AE1C28,#21468B)'},
  {nm:'فرنسا', code:'FR', ms:74, flag:'linear-gradient(135deg,#0055A4,#EF4135)'},
  {nm:'كوريا', code:'KR', ms:44, flag:'linear-gradient(135deg,#CD2E3A,#0047A0)'},
  {nm:'الهند', code:'IN', ms:18, flag:'linear-gradient(135deg,#FF9933,#138808)'}
];

// ============ NAVIGATION ============
function goScreen(sc){
  document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});
  var el = document.getElementById('sc-'+sc) || document.getElementById('sc-home');
  el.classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-sc')===sc);
  });
}
function toggleSet(el){ var t=el.querySelector('.toggle'); if(t) t.classList.toggle('on'); }

// ============ COUNTRY PILLS ============
function renderCountryPills(){
  var wrap=document.getElementById('countryPills'); if(!wrap) return; wrap.innerHTML='';
  countries.forEach(function(c){
    var d=document.createElement('div');
    d.className='cpill'+(c.nm===state.current?' active':'');
    d.innerHTML='<div class="cflag" style="background:'+c.flag+'"></div>'+c.nm;
    d.onclick=function(){selectCountry(c);};
    wrap.appendChild(d);
  });
}
function selectCountry(c){
  state.current=c.nm; state.ping=c.ms+'ms'; state.code=c.code; state.flag=c.flag;
  document.getElementById('serverName').textContent=c.nm;
  document.getElementById('serverPing').textContent=c.ms+'ms';
  document.getElementById('flagDot').style.background=c.flag;
  renderCountryPills();
  vibrate(20);
  addLog('config','تم اختيار '+c.nm);
}
renderCountryPills();

// ============ TIMER ============

// ============ VPN TOGGLE (PRESERVED) ============
function toggleVPN(){
  if(state.connecting) return;
  if(!state.connected){
    // Check if a config is active
    if(activeConfigId === null || !configs.length){
      if(typeof showToast === 'function') showToast('استورد وفعّل كونفيغ .dgvpn أولاً');
      return;
    }
    var activeCfg = configs.find(function(c){ return c.id === activeConfigId; });
    if(!activeCfg){
      if(typeof showToast === 'function') showToast('استورد وفعّل كونفيغ .dgvpn أولاً');
      return;
    }
    state.connecting=true;
    var btn=document.getElementById('powerBtn');
    var ring=document.getElementById('powerRing');
    btn.classList.add('connecting');
    if(ring) ring.classList.add('connecting');
    document.getElementById('statusText').textContent='جاري الاتصال...';
    vibrate(30);
    addLog('info','بدء الاتصال · '+activeCfg.name);

    // Call Android VPN service
    if(typeof Android !== 'undefined' && Android.connectVpn){
      // Build the .dgvpn content from stored config
      var cfgContent = JSON.stringify({
        type: 'DotGlobe-VPN',
        version: '9.0',
        enc: activeCfg.enc || ''
      });
      Android.connectVpn(cfgContent);
    } else {
      // Fallback: simulate connection (web preview only)
      setTimeout(function(){
        onVpnConnected();
      }, 2600);
    }
  } else {
    // Disconnect
    if(typeof Android !== 'undefined' && Android.disconnectVpn){
      Android.disconnectVpn();
    }
    onVpnDisconnected();
  }
}

function onVpnConnected(){
  state.connecting=false; state.connected=true;
  document.body.classList.add('connected');
  var btn=document.getElementById('powerBtn');
  var ring=document.getElementById('powerRing');
  btn.classList.remove('connecting'); btn.classList.add('connected');
  if(ring) ring.classList.remove('connecting');
  document.getElementById('statusText').textContent='متصل';
  document.getElementById('globeAtm').style.opacity='1.6';
  vibrate([20,40,40]);
  addLog('info','تم الاتصال · IP مشفر · '+state.ping);
}

function onVpnDisconnected(){
  state.connected=false; state.connecting=false; state.elapsed=0;
  document.body.classList.remove('connected');
  var btn=document.getElementById('powerBtn');
  var ring=document.getElementById('powerRing');

function handleConfigUpload(event){
  var file = event.target.files[0];
  if(!file) return;
  if(!file.name.endsWith('.dgvpn')){
    if(typeof showToast === 'function') showToast('صيغة غير مدعومة — .dgvpn فقط');
    else alert('صيغة غير مدعومة — .dgvpn فقط');
    event.target.value = '';
    return;
  }
  var reader = new FileReader();
  reader.onload = function(e){
    var content = e.target.result;
    var cfgName = file.name.replace(/\.[^.]+$/, '');
    var proto = 'WireGuard';
    var encData = content;
    var isValid = false;
    try{
      var data = JSON.parse(content);
      if(data.type === 'DotGlobe-VPN'){
        isValid = true;
        if(data.name) cfgName = data.name;
        if(data.proto) proto = data.proto;
        if(data.enc) encData = data.enc;
      }
    }catch(err){}
    if(!isValid){
      if(typeof showToast === 'function') showToast('ملف .dgvpn غير صالح');
      else alert('ملف .dgvpn غير صالح');
      return;
    }
    var customName = prompt('سمّي الكونفيغ باش ما يتخلطش:', cfgName);
    if(customName !== null && customName.trim()) cfgName = customName.trim();
    var newCfg = {
      id: Date.now(),
      name: cfgName,
      proto: proto,
      enc: encData,
      file: file.name,
      date: new Date().toLocaleDateString('ar-DZ')
    };
    configs.unshift(newCfg);
    localStorage.setItem('dgvpn_configs', JSON.stringify(configs));
    renderConfigList();
    if(typeof showToast === 'function') showToast('تم استيراد: ' + cfgName);
    if(typeof addLog === 'function') addLog('config', 'استيراد كونفيغ: ' + cfgName);
  };
  reader.readAsText(file);
  event.target.value = '';
}

/* ============ CREATE + EXPORT .dgvpn (PRESERVED) ============ */
var DGVPN_KEY = 'DotGlobeVPN_2026_ALPHA_GO_islem';

function xorEncrypt(text, key){
  var result = '';
  for(var i = 0; i < text.length; i++){
    result += String.fromCharCode(text.charCodeAt(i) ^ key.charCodeAt(i % key.length));
  }
  return result;
}

function toBase64(str){
  return btoa(unescape(encodeURIComponent(str)));
}

function fromBase64(b64){
  return decodeURIComponent(escape(atob(b64)));
}

function exportDarkFile(){
  var name = (document.getElementById('cfgName') && document.getElementById('cfgName').value || '').trim();
  var host = (document.getElementById('cfgHost') && document.getElementById('cfgHost').value || '').trim();
  var port = (document.getElementById('cfgPort') && document.getElementById('cfgPort').value || '').trim();

  if(!name){ if(typeof showToast === 'function') showToast('أدخل اسم الكونفيغ'); else alert('أدخل اسم الكونفيغ'); return; }
  if(!host){ if(typeof showToast === 'function') showToast('أدخل عنوان الخادم'); else alert('أدخل عنوان الخادم'); return; }
  if(!port){ if(typeof showToast === 'function') showToast('أدخل المنفذ'); else alert('أدخل المنفذ'); return; }

  var proto = (document.getElementById('cfgProto') && document.getElementById('cfgProto').value) || 'vless';
  var transport = (document.getElementById('cfgTransport') && document.getElementById('cfgTransport').value) || 'tcp';
  var dns = (document.getElementById('cfgDns') && document.getElementById('cfgDns').value) || '1.1.1.1';
  var payload = (document.getElementById('cfgPayload') && document.getElementById('cfgPayload').value) || '';
  var sni = (document.getElementById('cfgSni') && document.getElementById('cfgSni').value) || '';
  var user = (document.getElementById('cfgUser') && document.getElementById('cfgUser').value) || '';
  var pass = (document.getElementById('cfgPass') && document.getElementById('cfgPass').value) || '';

  var cfgData = {
    app: 'DotGlobe',
    version: '9.0',
    name: name,
    proto: proto,
    host: host,
    port: parseInt(port),
    transport: transport,
    dns: dns,
    payload: payload,
    sni: sni,
    user: user,
    pass: pass,
    created: new Date().toISOString()
  };

  var jsonStr = JSON.stringify(cfgData);
  var encrypted = toBase64(xorEncrypt(jsonStr, DGVPN_KEY));

  var darkContent = JSON.stringify({
    type: 'DotGlobe-VPN',
    version: '9.0',
    enc: encrypted
  }, null, 2);

  var blob = new Blob([darkContent], {type: 'application/octet-stream'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = name.replace(/\s+/g, '_') + '.dgvpn';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

  var newCfg = {
    id: Date.now(),
    name: name,
    proto: cfgData.proto,
    enc: encrypted,
    file: name.replace(/\s+/g, '_') + '.dgvpn',
    date: new Date().toLocaleDateString('ar-DZ')
  };
  configs.unshift(newCfg);
  localStorage.setItem('dgvpn_configs', JSON.stringify(configs));
  renderConfigList();

  if(typeof showToast === 'function') showToast('تم تصدير: ' + name + '.dgvpn');
  if(typeof addLog === 'function') addLog('config', 'تصدير كونفيغ: ' + name + '.dgvpn');
}

// ============ THREE.JS DOT-MATRIX POINT-CLOUD GLOBE ============
var G = (function(){
  var canvas=document.getElementById('globeCanvas');
  var renderer,scene,camera,globe,points,atm,stars;
  var rotSpeed=0.0025, dragging=false, lastX=0,lastY=0, autoRot=true;
  var pointsMat;
  var highlightAttr=null; // for selected country region brightness

  // dot texture via canvas
  function makeDotTexture(){
    var c=document.createElement('canvas'); c.width=64; c.height=64;
    var ctx=c.getContext('2d');
    var g=ctx.createRadialGradient(32,32,0,32,32,32);
    g.addColorStop(0,'rgba(255,255,255,1)');
    g.addColorStop(0.35,'rgba(255,255,255,0.85)');
    g.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,64,64);
    var tex=new THREE.CanvasTexture(c); return tex;
  }

  // crude landmass mask (lat/lon boxes approximating continents)
  function isLand(lat, lon){
    // lat in [-90,90], lon in [-180,180]
    // define approximate continent regions as lat/lon polygon-ish boxes
    var regions=[
      // North America
      {la:[25,70], lo:[-170,-55]},
      // South America
      {la:[-55,12], lo:[-82,-35]},
      // Europe
      {la:[36,71], lo:[-10,40]},
      // Africa
      {la:[-35,37], lo:[-18,52]},
      // Middle East
      {la:[12,42], lo:[35,63]},
      // Asia
      {la:[5,75], lo:[40,150]},
      // SE Asia / Indonesia
      {la:[-10,25], lo:[95,141]},
      // Australia
      {la:[-39,-10], lo:[113,154]},
      // Greenland
      {la:[60,83], lo:[-55,-20]}
    ];
    for(var i=0;i<regions.length;i++){
      var r=regions[i];
      if(lat>=r.la[0] && lat<=r.la[1] && lon>=r.lo[0] && lon<=r.lo[1]) return true;
    }
    return false;
  }

  function init(){
    var size=260;
    renderer=new THREE.WebGLRenderer({canvas:canvas,alpha:true,antialias:true});
    renderer.setSize(size,size,false);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));

    scene=new THREE.Scene();
    camera=new THREE.PerspectiveCamera(45,1,0.1,100);
    camera.position.z=3.0;

    var tex=makeDotTexture();

    // Build point cloud from sphere vertices, sampling landmass
    var geo=new THREE.SphereGeometry(1, 96, 64);
    var positions=geo.attributes.position;
    var N=positions.count;
    var landPos=[];
    var landCol=[];
    var baseCol=new THREE.Color(0xA855F7);
    var glowCol=new THREE.Color(0xC77DFF);

    for(var i=0;i<N;i++){
      var x=positions.getX(i), y=positions.getY(i), z=positions.getZ(i);
      // convert to lat/lon
      var lat=Math.asin(y)*180/Math.PI;
      var lon=Math.atan2(z,x)*180/Math.PI;
      if(isLand(lat,lon)){
        landPos.push(x,y,z);
        // highlight Algeria / North Africa region (lat ~22-37, lon ~-9 to 12) brighter
        var bright=0.55;
        if(lat>=18 && lat<=38 && lon>=-12 && lon<=14){ bright=1.0; }
        var col=glowCol.clone().lerp(baseCol, 1-bright);
        landCol.push(col.r*bright, col.g*bright, col.b*bright);
      }
    }
    // If too few, add randomized extra land dots for density (6000+ target)
    var extraTarget=6500;
    while(landPos.length/3 < extraTarget){
      var u=Math.random(), v=Math.random();
      var theta=2*Math.PI*u;
      var phi=Math.acos(2*v-1);
      var x2=Math.sin(phi)*Math.cos(theta);
      var y2=Math.cos(phi);
      var z2=Math.sin(phi)*Math.sin(theta);
      var lat2=Math.asin(y2)*180/Math.PI;
      var lon2=Math.atan2(z2,x2)*180/Math.PI;
      if(isLand(lat2,lon2)){
        landPos.push(x2,y2,z2);
        var bright2=0.5+Math.random()*0.15;
        if(lat2>=18 && lat2<=38 && lon2>=-12 && lon2<=14){ bright2=1.0; }
        var c2=glowCol.clone().lerp(baseCol, 1-bright2);
        landCol.push(c2.r*bright2, c2.g*bright2, c2.b*bright2);
      }
    }

    var pgeo=new THREE.BufferGeometry();
    pgeo.setAttribute('position', new THREE.Float32BufferAttribute(landPos,3));
    pgeo.setAttribute('color', new THREE.Float32BufferAttribute(landCol,3));
    pointsMat=new THREE.PointsMaterial({
      size:0.022, map:tex, vertexColors:true, transparent:true, opacity:0.9,
      blending:THREE.AdditiveBlending, depthWrite:false, sizeAttenuation:true
    });
    points=new THREE.Points(pgeo, pointsMat);
    globe=new THREE.Group();
    globe.add(points);
    scene.add(globe);

    // dark inner sphere to give globe body
    var igeo=new THREE.SphereGeometry(0.985,48,48);
    var imat=new THREE.MeshBasicMaterial({color:0x05000a, transparent:true, opacity:0.92});
    var inner=new THREE.Mesh(igeo,imat);
    globe.add(inner);

    // atmosphere sprite glow behind globe
    var atmCanvas=document.createElement('canvas'); atmCanvas.width=256; atmCanvas.height=256;
    var actx=atmCanvas.getContext('2d');
    var ag=actx.createRadialGradient(128,128,40,128,128,128);
    ag.addColorStop(0,'rgba(199,125,255,0.0)');
    ag.addColorStop(0.5,'rgba(168,85,247,0.25)');
    ag.addColorStop(0.75,'rgba(168,85,247,0.10)');
    ag.addColorStop(1,'rgba(0,0,0,0)');
    actx.fillStyle=ag; actx.fillRect(0,0,256,256);
    var atmTex=new THREE.CanvasTexture(atmCanvas);
    var atmMat=new THREE.SpriteMaterial({map:atmTex, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false});
    atm=new THREE.Sprite(atmMat);
    atm.scale.set(3.2,3.2,1);
    scene.add(atm);

    // stars
    var sgeo=new THREE.BufferGeometry();
    var Ns=500, spos=new Float32Array(Ns*3);
    for(var j=0;j<Ns;j++){var r=18+Math.random()*30,th=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1);spos[j*3]=r*Math.sin(ph)*Math.cos(th);spos[j*3+1]=r*Math.sin(ph)*Math.sin(th);spos[j*3+2]=r*Math.cos(ph);}
    sgeo.setAttribute('position',new THREE.BufferAttribute(spos,3));
    var smat=new THREE.PointsMaterial({color:0xffffff,size:0.08,transparent:true,opacity:0.6,sizeAttenuation:true});
    stars=new THREE.Points(sgeo,smat); scene.add(stars);

    // drag
    canvas.addEventListener('pointerdown',onDown);
    canvas.addEventListener('pointermove',onMove);
    canvas.addEventListener('pointerup',onUp);
    canvas.addEventListener('pointerleave',onUp);

    animate();
  }

  function onDown(e){dragging=true;lastX=e.clientX;lastY=e.clientY;autoRot=false;}
  function onMove(e){
    if(!dragging)return;
    var dx=e.clientX-lastX, dy=e.clientY-lastY;
    globe.rotation.y+=dx*0.005;
    globe.rotation.x+=dy*0.005;
    globe.rotation.x=Math.max(-1.2,Math.min(1.2,globe.rotation.x));
    lastX=e.clientX; lastY=e.clientY;
  }
  function onUp(){dragging=false;autoRot=true;}

  function animate(){
    requestAnimationFrame(animate);
    if(autoRot){globe.rotation.y+=state.connected?rotSpeed*2.2:rotSpeed;}
    atm.scale.setScalar(state.connected?3.6:3.2);
    if(pointsMat){ pointsMat.opacity=state.connected?1.0:0.85; pointsMat.size=state.connected?0.025:0.022; }
    stars.rotation.y+=0.0003;
    renderer.render(scene,camera);
  }

  return {init:init};
})();
window.addEventListener('load',function(){ try{G.init();}catch(e){console.error('globe',e);} });
</script>
